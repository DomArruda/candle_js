name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  prebuild:
    name: prebuild (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # linux-x64, darwin-x64, darwin-arm64, win32-x64.
        # Add `ubuntu-24.04-arm` for linux-arm64 if you publish to arm servers.
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build native addon
        run: cargo build --release

      - name: Stage addon
        run: bun scripts/copy-native.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.os }}
          path: prebuilds
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Collect prebuilds
        uses: actions/download-artifact@v4
        with:
          path: prebuilds
          pattern: prebuild-*
          merge-multiple: true

      - name: Install JS deps
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test against the packaged prebuilds
        run: bun test

      - name: Compile the library (dist/)
        run: bun run build:js

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
