<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>candle_js · WASM demo</title>
  <style>
    :root { color-scheme: light; --ink:#1f2933; --muted:#5b6873; --line:#dde4e8; --bg:#f6f8f9; --accent:#3f5d6b; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 ui-sans-serif,system-ui,sans-serif; }
    main { width:min(100% - 40px, 820px); margin:0 auto; padding:32px 0 48px; }
    h1 { margin:0 0 4px; font-size:24px; letter-spacing:-.02em; }
    h2 { margin:0 0 10px; font-size:15px; }
    p { margin:0 0 20px; color:var(--muted); }
    section { margin:18px 0; padding:18px; border:1px solid var(--line); border-radius:10px; background:#fff; }
    pre { margin:0; padding:12px; overflow:auto; border-radius:7px; background:#f2f5f6; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
    button { margin-bottom:12px; padding:8px 13px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
    button:disabled { opacity:.55; cursor:default; }
    code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    .note { margin:14px 0 0; font-size:12px; }
  </style>
</head>
<body>
<main>
  <h1>candle_js in the browser</h1>
  <p>This page runs <code>candle-core</code> as WebAssembly (CPU backend) and calls it from both JavaScript and Python via Pyodide.</p>

  <section>
    <h2>JavaScript</h2>
    <pre id="js-out">loading wasm...</pre>
  </section>

  <section>
    <h2>Python via Pyodide</h2>
    <button id="py-run">Load Pyodide and call candle_wasm</button>
    <pre id="py-out">not loaded</pre>
  </section>

  <p class="note" id="gpu"></p>
</main>

<script type="module">
import init, { matmul, train_xor, version } from "./pkg/candle_wasm.js";

const jsOut = document.getElementById("js-out");
await init();

const a = new Float32Array([1, 2, 3, 4]);
const b = new Float32Array([5, 6, 7, 8]);
const product = Array.from(matmul(a, 2, 2, b, 2, 2));
const xor = Array.from(train_xor(300)).map((v) => Math.round(v));

jsOut.textContent = [
  version(),
  `matmul: ${JSON.stringify(product)}`,
  `xor after 300 steps: ${JSON.stringify(xor)}`,
].join("\n");

document.getElementById("gpu").textContent =
  "gpu" in navigator
    ? "WebGPU is available in this browser, but candle's current WASM build uses the CPU backend. A WebGPU backend is an open upstream request (candle issue #344)."
    : "WebGPU is not available here; candle's WASM build uses the CPU backend.";

const button = document.getElementById("py-run");
const pyOut = document.getElementById("py-out");
button.addEventListener("click", async () => {
  button.disabled = true;
  pyOut.textContent = "loading Pyodide...";
  try {
    const { loadPyodide } = await import(
      "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.mjs"
    );
    const py = await loadPyodide();
    py.globals.set("candle_wasm", { matmul, train_xor, version });
    const result = await py.runPythonAsync(`
from pyodide.ffi import to_js
import js

a = js.Float32Array.new(to_js([1.0, 2.0, 3.0, 4.0]))
b = js.Float32Array.new(to_js([5.0, 6.0, 7.0, 8.0]))
product = [float(v) for v in candle_wasm.matmul(a, 2, 2, b, 2, 2)]
predictions = [round(float(v), 2) for v in candle_wasm.train_xor(300)]

f"matmul={product}\\nxor={predictions}"
`);
    pyOut.textContent = result + "\n(called from Python)";
  } catch (err) {
    pyOut.textContent = String(err);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
